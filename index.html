<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/524_character.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>524 - Rhythm Web MV</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- メインCanvas -->
    <canvas id="mv-canvas"></canvas>

    <!-- スタートオーバーレイ（初回ジェスチャーアンロック） -->
    <div id="start-overlay" class="overlay active">
      <div class="start-card">
        <div class="avatar-preview">
          <img src="./assets/524_character.svg" alt="Character 524" class="preview-img" />
        </div>
        <h1 class="title">524</h1>
        <p class="tagline">Interactive Rhythm Music Video</p>
        <button id="start-btn" class="start-button">
          <span class="btn-icon">▶</span>
          <span class="btn-text">START SESSION</span>
        </button>
        <p class="hint">524と一緒にリズムに乗ろう！</p>
      </div>
    </div>

    <!-- Duolingo風: ライブ・ステータスヘッダー -->
    <header class="duo-header">
      <div class="brand-pill">
        <span class="brand-dot"></span>
        <span class="brand-title">524 BEAT</span>
      </div>

      <!-- グルーヴプログレスバー -->
      <div class="groove-progress-wrapper" title="グルーヴゲージ (満タンでFEVER!)">
        <div id="groove-bar" class="groove-progress-bar" style="width: 20%;"></div>
      </div>

      <!-- Duolingo風ステータス (Hearts / Combo / Score) -->
      <div class="status-stats">
        <div class="stat-badge hearts" title="ライフ">
          <span class="stat-icon">❤️</span>
          <span id="hearts-count" class="stat-val">5</span>
        </div>
        <div class="stat-badge streak" title="コンボストリーク">
          <span class="stat-icon">🔥</span>
          <span id="combo-count" class="stat-val">0</span>
        </div>
        <div class="stat-badge score" title="スコア">
          <span class="stat-icon">💎</span>
          <span id="score-val" class="stat-val">0</span>
        </div>
      </div>

      <div class="top-actions">
        <button id="mute-btn" class="glass-round-btn" aria-label="音声ミュート切替" title="ミュート (M)">
          <span id="mute-icon">🔊</span>
        </button>
        <button id="fullscreen-btn" class="glass-round-btn" aria-label="全画面表示" title="全画面表示">
          <span>⛶</span>
        </button>
      </div>
    </header>

    <!-- 音ゲー・リズム操作エリア ＆ Mobbin参考ピルドック -->
    <main class="hud-dock-wrapper">
      <!-- 5レーン・タップパッド（1〜5キー or タップ） -->
      <div class="rhythm-pad-bar">
        <button class="rhythm-pad" data-lane="0"><span class="pad-num">1</span></button>
        <button class="rhythm-pad" data-lane="1"><span class="pad-num">2</span></button>
        <button class="rhythm-pad" data-lane="2"><span class="pad-num">3</span></button>
        <button class="rhythm-pad" data-lane="3"><span class="pad-num">4</span></button>
        <button class="rhythm-pad" data-lane="4"><span class="pad-num">5</span></button>
      </div>

      <!-- 統合フローティング・ピルドック -->
      <div class="pill-dock">
        <button id="play-pause-btn" class="dock-play-btn" aria-label="再生・一時停止" title="Space">
          <span id="play-icon">⏸</span>
        </button>

        <!-- モード切替セグメント -->
        <div class="dock-segment-group" role="group" aria-label="グルーヴモード切替">
          <button class="dock-segment-btn" data-mode="chill">
            <span class="mode-label">CHILL</span>
          </button>
          <button class="dock-segment-btn active" data-mode="groove">
            <span class="mode-label">GROOVE</span>
          </button>
          <button class="dock-segment-btn" data-mode="fever">
            <span class="mode-label">★ FEVER</span>
          </button>
        </div>

        <!-- リアルタイム・ミニイコライザー波形 -->
        <div class="dock-eq-visualizer" title="オーディオビート波形">
          <span class="eq-bar eq-bar-1"></span>
          <span class="eq-bar eq-bar-2"></span>
          <span class="eq-bar eq-bar-3"></span>
          <span class="eq-bar eq-bar-4"></span>
        </div>
      </div>

      <!-- 操作ヒントチップス -->
      <div class="hint-chips">
        <span class="chip"><kbd>1-5</kbd> ノーツ叩き</span>
        <span class="chip"><kbd>Drag / Space</kbd> POYON引っ張り</span>
        <span class="chip"><kbd>Mouse</kbd> 音響フィルター</span>
      </div>
    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
