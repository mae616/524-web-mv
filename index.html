<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/524_character.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1f6475" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="524 Beat" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./assets/524_character.png" />
    <title>524 BEAT - インタラクティブWeb MV＆チル音ゲー</title>
    <meta name="description" content="黄色いまるいやつ「524」と一緒にビートに乗ろう！引っ張ってPOYON・BION！スマホでもPCでも遊べるブラウザ音ゲー＆ミュージックビデオ。" />

    <!-- Open Graph Protocol (OGP) -->
    <meta property="og:title" content="524 BEAT - インタラクティブWeb MV＆チル音ゲー" />
    <meta property="og:description" content="黄色いまるいやつ「524」と一緒にビートに乗ろう！引っ張ってPOYON・BION！スマホでもPCでも遊べるブラウザ音ゲー＆ミュージックビデオ。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mae616.github.io/524-web-mv/" />
    <meta property="og:image" content="https://mae616.github.io/524-web-mv/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="524 BEAT" />
    <meta property="og:locale" content="ja_JP" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="524 BEAT - インタラクティブWeb MV＆チル音ゲー" />
    <meta name="twitter:description" content="黄色いまるいやつ「524」と一緒にビートに乗ろう！引っ張ってPOYON・BION！スマホでもPCでも遊べるブラウザ音ゲー＆ミュージックビデオ。" />
    <meta name="twitter:image" content="https://mae616.github.io/524-web-mv/ogp.png" />

    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- メインCanvas -->
    <canvas id="mv-canvas"></canvas>

    <!-- スタートオーバーレイ（初回ジェスチャーアンロック / タイトルモーダル） -->
    <div id="start-overlay" class="overlay active">
      <div class="start-card">
        <button id="start-close-btn" class="start-close-btn" aria-label="閉じる" title="ゲームに戻る" style="display: none;">✕</button>
        <div class="avatar-preview">
          <img src="./assets/524_character.png" alt="Character 524" class="preview-img" />
        </div>
        <h1 class="title">524</h1>
        <p class="tagline">Interactive Rhythm Music Video</p>

        <!-- 難易度セレクター（EASY / NORMAL / HARD） -->
        <div class="diff-selector" role="group" aria-label="難易度選択">
          <button class="diff-btn" data-diff="easy">EASY</button>
          <button class="diff-btn active" data-diff="normal">NORMAL</button>
          <button class="diff-btn" data-diff="hard">HARD</button>
        </div>

        <!-- 524スキンカラー（着せ替え）セレクター -->
        <div class="skin-selector" role="group" aria-label="524カラー着せ替え">
          <span class="skin-label">COLOR</span>
          <div class="skin-dots">
            <button class="skin-btn active" data-skin="yellow" title="クラシックイエロー" style="--skin-c: #ffd538;"></button>
            <button class="skin-btn" data-skin="pink" title="サクラピンク" style="--skin-c: #ff85a2;"></button>
            <button class="skin-btn" data-skin="mint" title="ミントグリーン" style="--skin-c: #55efc4;"></button>
            <button class="skin-btn" data-skin="blue" title="ソーダブルー" style="--skin-c: #00cec9;"></button>
            <button class="skin-btn" data-skin="purple" title="ラベンダーパープル" style="--skin-c: #a29bfe;"></button>
          </div>
          <span id="skin-name-badge" class="skin-name-badge">CLASSIC</span>
        </div>

        <button id="start-btn" class="start-button">
          <span class="btn-icon">▶</span>
          <span class="btn-text">START SESSION</span>
        </button>
        <p class="hint">524と一緒にリズムに乗ろう！</p>
      </div>
    </div>

    <!-- Duolingo風: ライブ・ステータスヘッダー -->
    <header class="duo-header">
      <button id="brand-pill-btn" class="brand-pill" aria-label="タイトル・設定画面を開く" title="タイトル画面を開く (難易度・スキン変更)">
        <span class="brand-dot"></span>
        <span class="brand-title">524 BEAT</span>
      </button>

      <!-- グルーヴプログレスバー -->
      <div class="groove-progress-wrapper" title="グルーヴゲージ (満タンでFEVER!)">
        <div id="groove-bar" class="groove-progress-bar" style="width: 20%;"></div>
      </div>

      <!-- Duolingo風ステータス (Hearts / Combo / Score) -->
      <div class="status-stats">
        <div class="stat-badge hearts" title="ライフ">
          <span class="stat-icon">❤️</span>
          <span id="hearts-count" class="stat-val">5</span>
        </div>
        <div class="stat-badge streak" title="コンボストリーク">
          <span class="stat-icon">🔥</span>
          <span id="combo-count" class="stat-val">0</span>
        </div>
        <div class="stat-badge score" title="スコア">
          <span class="stat-icon">💎</span>
          <span id="score-val" class="stat-val">0</span>
        </div>
      </div>

      <div class="top-actions">
        <button id="finish-btn" class="glass-round-btn finish" aria-label="終了・スコア確認" title="終了してスコア確認">
          <span>🏁</span>
        </button>
        <button id="mute-btn" class="glass-round-btn" aria-label="音声ミュート切替" title="ミュート (M)">
          <span id="mute-icon">🔊</span>
        </button>
        <button id="fullscreen-btn" class="glass-round-btn" aria-label="全画面表示" title="全画面表示">
          <span>⛶</span>
        </button>
      </div>
    </header>

    <!-- リザルト画面（クリア時 ＆ 途中リタイア時） -->
    <div id="result-overlay" class="overlay">
      <div class="result-card">
        <div class="result-badge-wrap">
          <div id="result-badge" class="result-title-badge clear">STAGE CLEAR !!</div>
          <div id="result-diff-badge" class="result-diff-pill">NORMAL</div>
        </div>

        <div class="result-char-preview">
          <img src="./assets/524_character.png" alt="524 Character" class="result-avatar" />
          <div id="result-rank" class="rank-circle rank-s">S</div>
        </div>

        <div class="result-score-block">
          <div class="result-score-label">FINAL SCORE</div>
          <div id="result-score-number" class="result-score-num">0</div>
          <div id="result-best-badge" class="result-best-badge">👑 NEW RECORD !!</div>
          <div class="result-best-row">
            <span class="best-lbl">PERSONAL BEST:</span>
            <span id="result-best-score" class="best-num">0</span>
          </div>
        </div>

        <div class="result-grid">
          <div class="result-stat-item stat-combo">
            <span class="lbl">MAX COMBO</span>
            <span id="result-max-combo" class="val">0 🔥</span>
          </div>
          <div class="result-stat-item stat-hearts">
            <span class="lbl">HEARTS</span>
            <span id="result-hearts" class="val">5 ❤️</span>
          </div>
          <div class="result-stat-item stat-perfect">
            <span class="lbl">PERFECT</span>
            <span id="result-perfects" class="val">0 ✨</span>
          </div>
          <div class="result-stat-item stat-miss">
            <span class="lbl">MISS</span>
            <span id="result-misses" class="val">0 💤</span>
          </div>
        </div>

        <div class="result-actions">
          <button id="retry-btn" class="action-btn retry-btn">
            <span class="btn-icon">🔄</span>
            <span>もう一度遊ぶ</span>
          </button>
          <button id="share-x-btn" class="action-btn x-share">
            <span class="btn-icon">𝕏</span>
            <span>Xで結果をシェアして競う！</span>
          </button>
          <button id="copy-result-btn" class="action-btn copy-btn">
            <span class="btn-icon">📋</span>
            <span id="copy-btn-text">結果をコピー</span>
          </button>
        </div>
      </div>
    </div>

    <!-- 音ゲー・リズム操作エリア ＆ Mobbin参考ピルドック -->
    <main class="hud-dock-wrapper">
      <!-- 5レーン・タップパッド（1〜5キー or タップ）＆ 引っ張りスリング（POYON / BION） -->
      <div class="rhythm-pad-bar">
        <button class="rhythm-pad" data-lane="0" title="1キー or Aキー">
          <span class="pad-num">1</span>
          <span class="pad-sub-key">A</span>
        </button>
        <button class="rhythm-pad" data-lane="1" title="2キー or Sキー">
          <span class="pad-num">2</span>
          <span class="pad-sub-key">S</span>
        </button>
        <button class="rhythm-pad" data-lane="2" title="3キー or Dキー">
          <span class="pad-num">3</span>
          <span class="pad-sub-key">D</span>
        </button>
        <button class="rhythm-pad" data-lane="3" title="4キー or Fキー">
          <span class="pad-num">4</span>
          <span class="pad-sub-key">F</span>
        </button>
        <button class="rhythm-pad" data-lane="4" title="5キー or Gキー">
          <span class="pad-num">5</span>
          <span class="pad-sub-key">G</span>
        </button>
        <div class="pad-divider"></div>
        <button class="rhythm-sling-btn poyon" id="sling-poyon-btn" title="ちょい引き (Space / P / 6 / Cキー / ちょいドラッグ)">
          <span class="sling-icon">🤏</span>
          <span class="sling-text">POYON</span>
          <span class="sling-sub-key">Space / P</span>
        </button>
        <button class="rhythm-sling-btn bion" id="sling-bion-btn" title="大引き (Enter / B / 7 / ↓キー / 大ドラッグ)">
          <span class="sling-icon">🚀</span>
          <span class="sling-text">BION</span>
          <span class="sling-sub-key">Enter / B</span>
        </button>
      </div>

      <!-- 統合フローティング・ピルドック -->
      <div class="pill-dock">
        <button id="play-pause-btn" class="dock-play-btn" aria-label="再生・一時停止" title="再生・一時停止">
          <span id="play-icon">⏸</span>
        </button>

        <!-- モード切替セグメント -->
        <div class="dock-segment-group" role="group" aria-label="グルーヴモード切替">
          <button class="dock-segment-btn" data-mode="chill">
            <span class="mode-label">CHILL</span>
          </button>
          <button class="dock-segment-btn active" data-mode="groove">
            <span class="mode-label">GROOVE</span>
          </button>
          <button class="dock-segment-btn" data-mode="fever">
            <span class="mode-label">★ FEVER</span>
          </button>
        </div>

        <!-- リアルタイム・ミニイコライザー波形 -->
        <div class="dock-eq-visualizer" title="オーディオビート波形">
          <span class="eq-bar eq-bar-1"></span>
          <span class="eq-bar eq-bar-2"></span>
          <span class="eq-bar eq-bar-3"></span>
          <span class="eq-bar eq-bar-4"></span>
        </div>
      </div>

      <!-- 操作ヒントチップス（代替キーも明示） -->
      <div class="hint-chips">
        <span class="chip"><kbd>1-5</kbd> / <kbd>A-G</kbd> ノーツ</span>
        <span class="chip"><kbd>Space</kbd> / <kbd>P</kbd> / <kbd>6</kbd> POYON</span>
        <span class="chip"><kbd>Enter</kbd> / <kbd>B</kbd> / <kbd>7</kbd> / <kbd>↓</kbd> BION</span>
        <span class="chip"><kbd>Drag</kbd> 524引っ張り</span>
      </div>
    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
